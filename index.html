<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wallpapers — 4K & UltraHD Gallery</title>
    <meta name="description" content="Curated gallery of 4K, 8K, anime, minimal, cyberpunk wallpapers with direct download by Saurabh Dhull.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.8); }

        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .light-mode .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(226, 232, 240, 0.9);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(99, 102, 241, 0.5);
            transform: translateY(-4px);
            box-shadow: 0 15px 25px -8px rgba(99, 102, 241, 0.3);
        }

        .light-mode .glass-card {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(226, 232, 240, 0.9);
        }

        .bg-grid-pattern {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        .light-mode .bg-grid-pattern {
            background-image: 
                linear-gradient(to right, rgba(0, 0, 0, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

    <!-- PURE VANILLA JS STATE ENGINE -->
    <script>
        // State
        let allWallpapers = Object.values(window.WALLPAPERS_RAW_DATABASE || {});
        let searchQuery = '';
        let selectedTag = 'all';
        let aspectFilter = 'all';
        let sortBy = 'default';
        let activeTab = 'all';
        let isDarkMode = true;
        let displayLimit = 24;
        let activeWallpaper = null;
        let isZoomed = false;
        let favorites = [];

        // Load Favorites
        try {
            const saved = localStorage.getItem('wallpaper_favorites');
            if (saved) favorites = JSON.parse(saved);
        } catch(e) {}

        // Format Helpers
        function formatTitle(filename) {
            return filename.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
        }
        function getFileExt(filename) {
            return filename.split('.').pop().toUpperCase();
        }
        function getResolutionLabel(w, h) {
            if (!w || !h) return 'HD';
            if (w >= 7680) return '8K UHD';
            if (w >= 3840 || h >= 2160) return '4K UHD';
            if (w >= 2560 || h >= 1440) return '2K QHD';
            if (w >= 1920 || h >= 1080) return '1080p FHD';
            return 'HD';
        }

        function isFavorite(fn) {
            return favorites.includes(fn);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-alert');
            const msgEl = document.getElementById('toast-msg');
            msgEl.textContent = msg;
            toast.classList.remove('translate-y-10', 'opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0', 'pointer-events-none');
            }, 3000);
        }

        // Popular Tags Computation
        function getPopularTags() {
            const counts = {};
            allWallpapers.forEach(w => {
                (w.tags || []).forEach(t => {
                    const tag = t.toLowerCase().trim();
                    if (tag) counts[tag] = (counts[tag] || 0) + 1;
                });
            });
            return Object.keys(counts)
                .map(k => ({ name: k, count: counts[k] }))
                .sort((a, b) => b.count - a.count)
                .slice(0, 15);
        }

        // Filter & Sort Engine
        function getFilteredWallpapers() {
            let list = [...allWallpapers];

            if (activeTab === 'favorites') {
                list = list.filter(w => favorites.includes(w.filename));
            }

            if (selectedTag !== 'all') {
                list = list.filter(w => (w.tags || []).some(t => t.toLowerCase() === selectedTag.toLowerCase()));
            }

            if (aspectFilter === 'desktop') {
                list = list.filter(w => (w.metadata.aspect_ratio || 1.78) >= 1.3);
            } else if (aspectFilter === 'mobile') {
                list = list.filter(w => (w.metadata.aspect_ratio || 1.78) < 1.0);
            } else if (aspectFilter === '4k') {
                list = list.filter(w => (w.metadata.width || 0) >= 3840);
            }

            if (searchQuery.trim()) {
                const q = searchQuery.toLowerCase().trim();
                if (q.startsWith('@')) {
                    const tagQ = q.slice(1);
                    list = list.filter(w => (w.tags || []).some(t => t.toLowerCase().includes(tagQ)));
                } else {
                    list = list.filter(w => 
                        formatTitle(w.filename).toLowerCase().includes(q) ||
                        (w.tags || []).some(t => t.toLowerCase().includes(q))
                    );
                }
            }

            if (sortBy === 'resolution') {
                list.sort((a, b) => (b.metadata.width * b.metadata.height) - (a.metadata.width * a.metadata.height));
            } else if (sortBy === 'size') {
                list.sort((a, b) => (b.metadata.file_size_mb || 0) - (a.metadata.file_size_mb || 0));
            } else if (sortBy === 'name') {
                list.sort((a, b) => a.filename.localeCompare(b.filename));
            }

            return list;
        }

        // Render Tag Chips Bar
        function renderTagsBar() {
            const container = document.getElementById('tags-bar');
            const tags = getPopularTags();

            let html = `<button onclick="selectTag('all')" class="px-3.5 py-1.5 rounded-2xl text-xs font-extrabold whitespace-nowrap transition-all flex items-center gap-1.5 cursor-pointer shadow-sm ${selectedTag === 'all' ? 'bg-gradient-to-r from-indigo-500 to-purple-600 text-white shadow-indigo-500/25 scale-105' : 'bg-slate-900/70 hover:bg-slate-800 border border-white/10 text-slate-300'}">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
                <span>All Wallpapers</span>
                <span class="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-950/50 text-indigo-300">${allWallpapers.length}</span>
            </button>`;

            tags.forEach(t => {
                const active = selectedTag === t.name;
                html += `<button onclick="selectTag('${t.name}')" class="px-3 py-1.5 rounded-2xl text-xs font-bold whitespace-nowrap transition-all flex items-center gap-1.5 cursor-pointer ${active ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-500/30 scale-105 border border-indigo-400/50' : 'bg-slate-900/60 hover:bg-slate-800 border border-white/10 text-slate-300'}">
                    <span class="capitalize">#${t.name}</span>
                    <span class="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-950/40 text-slate-400">${t.count}</span>
                </button>`;
            });

            container.innerHTML = html;
        }

        // Render Main Gallery Grid
        function renderGrid() {
            const grid = document.getElementById('wallpaper-grid');
            const filtered = getFilteredWallpapers();
            const visible = filtered.slice(0, displayLimit);

            // Update Counts
            document.getElementById('item-count-badge').textContent = `${filtered.length} Items`;
            document.getElementById('fav-count').textContent = favorites.length;
            document.getElementById('mobile-fav-count').textContent = favorites.length;

            const isResetVisible = selectedTag !== 'all' || searchQuery || activeTab === 'favorites' || aspectFilter !== 'all';
            document.getElementById('reset-btn').classList.toggle('hidden', !isResetVisible);

            // Gallery Title
            let titleText = 'Curated Gallery';
            if (activeTab === 'favorites') titleText = 'My Saved Favorites';
            else if (selectedTag !== 'all') titleText = `#${selectedTag} Wallpapers`;
            document.getElementById('gallery-title').children[0].textContent = titleText;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-16 text-center space-y-4 glass-panel rounded-3xl border border-white/10">
                    <div class="w-14 h-14 rounded-full bg-indigo-500/10 text-indigo-400 flex items-center justify-center mx-auto border border-indigo-500/30">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    </div>
                    <h3 class="text-base font-black text-white">No wallpapers match your criteria</h3>
                    <button onclick="resetFilters()" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-black transition-all shadow-lg shadow-indigo-500/30">Clear All Filters</button>
                </div>`;
                document.getElementById('pagination-container').classList.add('hidden');
                return;
            }

            let html = '';
            visible.forEach(w => {
                const fav = isFavorite(w.filename);
                const title = formatTitle(w.filename);
                const ext = getFileExt(w.filename);
                const resLabel = getResolutionLabel(w.metadata.width, w.metadata.height);

                html += `<div class="glass-card rounded-2xl sm:rounded-3xl overflow-hidden group flex flex-col relative">
                    <div class="relative aspect-[16/10] overflow-hidden bg-slate-950 cursor-pointer" onclick="openLightbox('${w.filename}')">
                        <img src="./images/${w.filename}" alt="${w.filename}" loading="lazy" onerror="this.src='${w.github_raw_url}'" class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-105">
                        
                        <div class="absolute top-2 left-2 flex flex-wrap items-center gap-1 z-10 pointer-events-none">
                            <span class="px-2 py-0.5 rounded-lg bg-slate-950/80 backdrop-blur-md border border-white/20 text-[9px] sm:text-[10px] font-extrabold tracking-wider uppercase text-cyan-300 shadow-lg">${resLabel}</span>
                        </div>

                        <button onclick="event.stopPropagation(); toggleFavorite('${w.filename}')" class="absolute top-2 right-2 p-1.5 rounded-xl backdrop-blur-md border transition-all z-10 cursor-pointer shadow-lg ${fav ? 'bg-rose-500/30 border-rose-500/60 text-rose-400' : 'bg-slate-950/60 border-white/20 text-white hover:bg-rose-500/20 hover:text-rose-400'}">
                            <svg class="w-3.5 h-3.5 ${fav ? 'fill-rose-500 text-rose-500' : ''}" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        </button>

                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-slate-950/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end justify-between p-3 z-20">
                            <div class="space-y-0.5 min-w-0">
                                <h4 class="text-xs sm:text-sm font-black text-white truncate drop-shadow">${title}</h4>
                                <p class="text-[10px] font-medium text-slate-300 flex items-center gap-1.5">
                                    <span>${w.metadata.width || 1920} x ${w.metadata.height || 1080}</span>
                                </p>
                            </div>
                            <button onclick="event.stopPropagation(); downloadWallpaper('${w.filename}')" class="p-2 rounded-xl bg-gradient-to-tr from-indigo-500 to-cyan-400 text-white hover:scale-110 active:scale-95 transition-all shadow-xl shadow-indigo-500/40 cursor-pointer shrink-0">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="p-2.5 flex items-center justify-between gap-1.5 border-t border-white/5 bg-slate-900/40">
                        <div class="flex items-center gap-1 overflow-x-auto hide-scrollbar">
                            ${(w.tags || []).slice(0, 2).map(t => `<span onclick="event.stopPropagation(); selectTag('${t}')" class="px-1.5 py-0.5 rounded-md bg-slate-800/80 hover:bg-indigo-600/30 border border-white/10 text-[9px] font-bold text-slate-300 hover:text-indigo-300 cursor-pointer transition-colors">#${t}</span>`).join('')}
                        </div>
                        <button onclick="event.stopPropagation(); downloadWallpaper('${w.filename}')" class="px-2 py-0.5 rounded-lg bg-indigo-500/20 hover:bg-indigo-500/30 border border-indigo-500/30 text-indigo-300 text-[10px] font-extrabold flex items-center gap-1 transition-all cursor-pointer shrink-0">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                            <span>Save</span>
                        </button>
                    </div>
                </div>`;
            });

            grid.innerHTML = html;

            // Pagination Button
            const remaining = filtered.length - displayLimit;
            const pagBtnContainer = document.getElementById('pagination-container');
            if (remaining > 0) {
                document.getElementById('remaining-count').textContent = remaining;
                pagBtnContainer.classList.remove('hidden');
            } else {
                pagBtnContainer.classList.add('hidden');
            }
        }

        // Actions
        function selectTag(t) {
            selectedTag = (selectedTag === t) ? 'all' : t;
            displayLimit = 24;
            renderTagsBar();
            renderGrid();
        }

        function onSearchInput(val) {
            searchQuery = val;
            displayLimit = 24;
            renderGrid();
        }

        function onAspectChange(val) {
            aspectFilter = val;
            displayLimit = 24;
            renderGrid();
        }

        function onSortChange(val) {
            sortBy = val;
            displayLimit = 24;
            renderGrid();
        }

        function toggleFavoritesTab() {
            activeTab = (activeTab === 'favorites') ? 'all' : 'favorites';
            displayLimit = 24;
            renderGrid();
        }

        function resetFilters(e) {
            if (e) e.preventDefault();
            searchQuery = '';
            selectedTag = 'all';
            aspectFilter = 'all';
            sortBy = 'default';
            activeTab = 'all';
            displayLimit = 24;
            document.getElementById('search-input').value = '';
            document.getElementById('aspect-select').value = 'all';
            document.getElementById('sort-select').value = 'default';
            renderTagsBar();
            renderGrid();
        }

        function loadMore() {
            displayLimit += 24;
            renderGrid();
        }

        function toggleFavorite(fn) {
            if (isFavorite(fn)) {
                favorites = favorites.filter(f => f !== fn);
                showToast(`Removed ${formatTitle(fn)} from Favorites`);
            } else {
                favorites.push(fn);
                showToast(`Saved ${formatTitle(fn)} to Favorites ❤️`);
            }
            try { localStorage.setItem('wallpaper_favorites', JSON.stringify(favorites)); } catch(e) {}
            renderGrid();
            if (activeWallpaper && activeWallpaper.filename === fn) {
                updateModalFavBtn();
            }
        }

        // FORCED DIRECT IMAGE DOWNLOAD ENGINE (Guarantees downloading file directly to device)
        async function downloadWallpaper(fn) {
            const item = allWallpapers.find(w => w.filename === fn);
            showToast(`Starting download for ${fn}...`);

            const triggerSave = (blob, filename) => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                }, 1000);
                showToast(`Downloaded ${filename} successfully!`);
            };

            // Method 1: Fetch relative image blob
            try {
                const response = await fetch('./images/' + fn);
                if (response.ok) {
                    const blob = await response.blob();
                    triggerSave(blob, fn);
                    return;
                }
            } catch(e) {}

            // Method 2: Fetch raw github image blob
            if (item && item.github_raw_url) {
                try {
                    const response = await fetch(item.github_raw_url);
                    if (response.ok) {
                        const blob = await response.blob();
                        triggerSave(blob, fn);
                        return;
                    }
                } catch(e) {}
            }

            // Method 3: Memory Canvas Blob Synthesis (100% Forces local Blob creation!)
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = function() {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth || img.width;
                    canvas.height = img.naturalHeight || img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    canvas.toBlob((blob) => {
                        if (blob) {
                            triggerSave(blob, fn);
                        } else {
                            fallbackDirectClick(fn);
                        }
                    }, 'image/png');
                } catch(e) {
                    fallbackDirectClick(fn);
                }
            };
            img.onerror = function() {
                fallbackDirectClick(fn);
            };
            img.src = './images/' + fn;
        }

        function fallbackDirectClick(fn) {
            const a = document.createElement('a');
            a.href = './images/' + fn;
            a.setAttribute('download', fn);
            a.download = fn;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast(`Downloading ${fn}...`);
        }

        // Lightbox Modal
        function openLightbox(fn) {
            const item = allWallpapers.find(w => w.filename === fn);
            if (!item) return;
            activeWallpaper = item;
            isZoomed = false;

            document.getElementById('modal-img').src = './images/' + fn;
            document.getElementById('modal-img').onerror = function() { this.src = item.github_raw_url; };
            document.getElementById('modal-badge').textContent = getResolutionLabel(item.metadata.width, item.metadata.height);
            document.getElementById('modal-title').textContent = formatTitle(fn);
            document.getElementById('modal-filename').textContent = fn;
            document.getElementById('modal-res').textContent = `${item.metadata.width || 1920} x ${item.metadata.height || 1080}`;
            document.getElementById('modal-size').textContent = `${item.metadata.file_size_mb || 1.2} MB`;
            document.getElementById('modal-aspect').textContent = item.metadata.aspect_ratio || '1.78';
            document.getElementById('modal-format').textContent = getFileExt(fn);

            const tagsEl = document.getElementById('modal-tags');
            tagsEl.innerHTML = (item.tags || []).map(t => `<span onclick="closeLightbox(); selectTag('${t}')" class="px-2 py-0.5 rounded-lg bg-slate-800 hover:bg-indigo-600/40 border border-white/10 text-[11px] font-bold text-slate-200 hover:text-white cursor-pointer transition-colors">#${t}</span>`).join('');

            updateModalFavBtn();
            document.getElementById('lightbox-modal').classList.remove('hidden');
        }

        function closeLightbox() {
            activeWallpaper = null;
            document.getElementById('lightbox-modal').classList.add('hidden');
        }

        function navigateLightbox(dir) {
            if (!activeWallpaper) return;
            const filtered = getFilteredWallpapers();
            const idx = filtered.findIndex(w => w.filename === activeWallpaper.filename);
            if (idx !== -1) {
                let nextIdx = idx + dir;
                if (nextIdx < 0) nextIdx = filtered.length - 1;
                if (nextIdx >= filtered.length) nextIdx = 0;
                openLightbox(filtered[nextIdx].filename);
            }
        }

        function toggleZoom() {
            isZoomed = !isZoomed;
            const img = document.getElementById('modal-img');
            img.classList.toggle('scale-150', isZoomed);
            img.classList.toggle('cursor-zoom-out', isZoomed);
            img.classList.toggle('cursor-zoom-in', !isZoomed);
        }

        function updateModalFavBtn() {
            if (!activeWallpaper) return;
            const fav = isFavorite(activeWallpaper.filename);
            document.getElementById('modal-fav-text').textContent = fav ? 'Saved' : 'Favorite';
        }

        function toggleActiveFavorite() {
            if (activeWallpaper) toggleFavorite(activeWallpaper.filename);
        }

        function downloadActiveWallpaper() {
            if (activeWallpaper) downloadWallpaper(activeWallpaper.filename);
        }

        function copyActiveLink() {
            if (!activeWallpaper) return;
            const url = activeWallpaper.github_raw_url || (window.location.origin + '/images/' + activeWallpaper.filename);
            navigator.clipboard.writeText(url);
            showToast('Copied raw image link to clipboard!');
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.documentElement.classList.toggle('dark', isDarkMode);
            document.body.classList.toggle('light-mode', !isDarkMode);
        }

        // Global Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                document.getElementById('search-input').focus();
            }
            if (activeWallpaper) {
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowLeft') navigateLightbox(-1);
                if (e.key === 'ArrowRight') navigateLightbox(1);
            }
        });

        // Initialize App Immediately
        renderTagsBar();
        renderGrid();
    </script>
</body>
</html>
